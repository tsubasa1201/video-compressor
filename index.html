<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動画を小さくするやつ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap');
  :root { --bg:#08090d; --panel:#101218; --panel-2:#161922; --line:#232733; --text:#eef1f6; --text-dim:#868d9c; --accent:#ffd23f; --accent-2:#ff7849; --green:#2ee6a0; --mono:'Space Mono',monospace; --sans:'Zen Kaku Gothic New',sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); background-image:radial-gradient(circle at 80% -10%,rgba(255,210,63,0.10),transparent 45%),radial-gradient(circle at 0% 110%,rgba(255,120,73,0.08),transparent 50%); color:var(--text); font-family:var(--sans); min-height:100vh; padding:32px 20px 80px; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:720px; margin:0 auto; }
  header { margin-bottom:26px; text-align:center; }
  h1 { font-size:32px; font-weight:900; letter-spacing:-0.03em; line-height:1.2; }
  h1 .hl { background:linear-gradient(120deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { color:var(--text-dim); font-size:14px; margin-top:10px; line-height:1.7; }
  .privacy { display:inline-flex; align-items:center; gap:6px; margin-top:14px; padding:6px 14px; background:rgba(46,230,160,0.1); border:1px solid rgba(46,230,160,0.3); border-radius:100px; font-size:12px; color:var(--green); font-weight:700; }
  .privacy svg { width:13px; height:13px; }
  .drop { margin-top:24px; border:2px dashed var(--line); border-radius:18px; padding:40px 24px; text-align:center; cursor:pointer; transition:all .25s ease; background:var(--panel); }
  .drop:hover, .drop.over { border-color:var(--accent); background:var(--panel-2); transform:translateY(-2px); }
  .drop-icon { width:60px; height:60px; margin:0 auto 16px; border-radius:16px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:grid; place-items:center; box-shadow:0 8px 28px rgba(255,210,63,0.3); }
  .drop-icon svg { width:30px; height:30px; stroke:#1a1206; }
  .drop h2 { font-size:19px; font-weight:900; margin-bottom:6px; }
  .drop p { color:var(--text-dim); font-size:13px; }
  .drop .browse { color:var(--accent); text-decoration:underline; }
  .drop.compact { padding:20px; }
  .drop.compact .drop-icon { width:40px; height:40px; margin-bottom:10px; border-radius:11px; }
  .drop.compact .drop-icon svg { width:20px; height:20px; }
  .drop.compact h2 { font-size:15px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; margin-top:20px; }
  .set-label { font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:12px; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .panel-head h3 { font-size:16px; font-weight:900; }
  .count-badge { font-family:var(--mono); font-size:12px; color:var(--text-dim); }
  .count-badge b { color:var(--accent); }
  .queue { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .qitem { display:flex; align-items:center; gap:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px; transition:border-color .2s; }
  .qitem.done { border-color:rgba(46,230,160,0.35); }
  .qitem.processing { border-color:var(--accent); }
  .qitem.error { border-color:var(--accent-2); }
  .qthumb { width:52px; height:52px; border-radius:9px; flex-shrink:0; background:#000; object-fit:cover; border:1px solid var(--line); }
  .qmeta { flex:1; min-width:0; }
  .qname { font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qstat { font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .qstat .ok { color:var(--green); } .qstat .err-t { color:var(--accent-2); } .qstat .arrow { opacity:0.6; }
  .qbar { height:5px; background:var(--bg); border-radius:100px; overflow:hidden; margin-top:6px; display:none; }
  .qitem.processing .qbar { display:block; }
  .qbar-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:100px; transition:width .3s ease; }
  .qaction { flex-shrink:0; }
  .qdl { display:inline-grid; place-items:center; width:38px; height:38px; border-radius:10px; background:var(--green); border:none; cursor:pointer; text-decoration:none; transition:transform .15s; }
  .qdl:hover { transform:translateY(-2px); } .qdl svg { width:18px; height:18px; stroke:#04110c; }
  .qx { background:none; border:none; color:var(--text-dim); cursor:pointer; padding:8px; border-radius:8px; transition:all .2s; }
  .qx:hover { background:var(--bg); color:var(--accent-2); } .qx svg { width:16px; height:16px; display:block; }
  .qspin { width:14px; height:14px; border:2px solid rgba(255,210,63,0.3); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  .qwait { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); }
  .adv-toggle { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:12px; background:transparent; border:1px solid var(--line); border-radius:12px; color:var(--text-dim); font-family:var(--sans); font-size:13px; font-weight:700; cursor:pointer; margin-bottom:18px; }
  .adv-toggle:hover { color:var(--text); border-color:var(--text-dim); }
  .adv-toggle svg { width:14px; height:14px; transition:transform .2s; }
  .adv-toggle.open svg { transform:rotate(180deg); }
  .adv { display:none; } .adv.show { display:block; }
  .seg { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
  .seg.four { grid-template-columns:repeat(4,1fr); }
  .seg-btn { background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:13px 8px; cursor:pointer; transition:all .18s; text-align:center; }
  .seg-btn:hover { border-color:var(--text-dim); }
  .seg-btn.active { border-color:var(--accent); background:rgba(255,210,63,0.08); }
  .seg-btn .t { font-weight:700; font-size:14px; display:block; }
  .seg-btn.active .t { color:var(--accent); }
  .seg-btn .d { font-size:11px; color:var(--text-dim); margin-top:3px; display:block; }
  .go { width:100%; padding:18px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#1a1206; font-family:var(--sans); font-weight:900; font-size:17px; cursor:pointer; transition:all .2s; box-shadow:0 8px 24px rgba(255,150,60,0.3); }
  .go:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 32px rgba(255,150,60,0.42); }
  .go:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .summary { background:linear-gradient(160deg,var(--panel-2),var(--panel)); border:1px solid rgba(46,230,160,0.3); border-radius:16px; padding:20px; margin-bottom:16px; text-align:center; }
  .summary .pct { font-family:var(--mono); font-size:40px; font-weight:700; line-height:1; background:linear-gradient(120deg,var(--green),var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .summary .lbl { font-size:13px; color:var(--text-dim); margin-top:6px; }
  .dl-all { width:100%; padding:16px; border:none; border-radius:14px; background:var(--green); color:#04110c; font-family:var(--sans); font-weight:900; font-size:15px; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .dl-all:hover { transform:translateY(-2px); } .dl-all svg { width:18px; height:18px; stroke:#04110c; }
  .again { width:100%; margin-top:10px; padding:13px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--text-dim); font-family:var(--sans); font-weight:700; font-size:14px; cursor:pointer; }
  .again:hover { border-color:var(--text-dim); color:var(--text); }
  .clear-btn { background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; text-decoration:underline; }
  .clear-btn:hover { color:var(--accent-2); }
  .err { margin-top:16px; padding:14px; border-radius:10px; background:rgba(255,120,73,0.1); border:1px solid rgba(255,120,73,0.3); color:var(--accent-2); font-size:13px; line-height:1.7; white-space:pre-wrap; }
  .loading-engine { margin-top:16px; padding:16px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); font-size:13px; color:var(--text-dim); display:flex; align-items:center; gap:10px; }
  .hidden { display:none !important; }
  .footnote { text-align:center; margin-top:32px; font-size:12px; color:var(--text-dim); line-height:1.7; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>動画を<span class="hl">ぎゅっと</span>小さく</h1>
    <p class="sub">複数まとめて、できるだけ小さいファイルにします。</p>
    <div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>ファイルはどこにもアップロードされません</div>
  </header>
  <div class="drop" id="drop">
    <div class="drop-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
    <h2>動画をまとめてドラッグ&ドロップ</h2>
    <p>または<span class="browse">ファイルを選択</span>（複数選択OK・MP4 / MOV / WebM / AVI など）</p>
    <input type="file" id="file" accept="video/*" multiple class="hidden">
  </div>
  <div class="card hidden" id="mainCard">
    <div class="panel-head"><h3>処理リスト</h3><span class="count-badge"><b id="cntTotal">0</b> 件 / 合計 <b id="cntSize">—</b></span></div>
    <div class="queue" id="queue"></div>
    <div style="text-align:right; margin-bottom:18px;"><button class="clear-btn" id="clearBtn">すべてクリア</button></div>
    <button class="adv-toggle" id="advToggle">こまかい設定（全ファイル共通）<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    <div class="adv" id="adv">
      <div class="set-label">圧縮の強さ</div>
      <div class="seg" id="quality">
        <div class="seg-btn" data-crf="26"><span class="t">そこそこ</span><span class="d">画質キープ</span></div>
        <div class="seg-btn active" data-crf="30"><span class="t">小さめ</span><span class="d">おすすめ</span></div>
        <div class="seg-btn" data-crf="34"><span class="t">最小</span><span class="d">とにかく軽く</span></div>
      </div>
      <div class="set-label">解像度</div>
      <div class="seg four" id="resolution">
        <div class="seg-btn" data-scale="0"><span class="t">元のまま</span></div>
        <div class="seg-btn" data-scale="1080"><span class="t">1080p</span></div>
        <div class="seg-btn active" data-scale="720"><span class="t">720p</span></div>
        <div class="seg-btn" data-scale="480"><span class="t">480p</span></div>
      </div>
    </div>
    <button class="go" id="goBtn">すべて小さくする</button>
    <div class="loading-engine hidden" id="engineLoad"><span class="qspin"></span><span id="engineLoadText">処理エンジンを準備中…（初回のみ少し時間がかかります）</span></div>
  </div>
  <div class="card hidden" id="resultCard">
    <div class="summary"><div class="pct" id="sumPct">—</div><div class="lbl" id="sumLbl">小さくなりました</div></div>
    <button class="dl-all" id="dlAllBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span id="dlAllLabel">すべてダウンロード</span></button>
    <button class="again" id="againBtn">新しく始める</button>
  </div>
  <div class="err hidden" id="errBox"></div>
  <p class="footnote">処理はすべてあなたのブラウザ内で完結します。動画は外部に一切送信されません。</p>
</div>
<script>
const $ = id => document.getElementById(id);
const drop=$('drop'), fileInput=$('file'), mainCard=$('mainCard'), resultCard=$('resultCard'), errBox=$('errBox'), queueEl=$('queue'), goBtn=$('goBtn');
let ffmpeg=null, ffmpegLoaded=false, isRunning=false;
let settings={ crf:30, scale:720 };
let items=[]; let uid=0;
drop.addEventListener('click', ()=> { if(!isRunning) fileInput.click(); });
drop.addEventListener('dragover', e=>{ e.preventDefault(); if(!isRunning) drop.classList.add('over'); });
drop.addEventListener('dragleave', ()=> drop.classList.remove('over'));
drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('over'); if(!isRunning) addFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e=>{ addFiles(e.target.files); fileInput.value=''; });
$('clearBtn').addEventListener('click', ()=> { if(!isRunning) clearAll(); });
$('againBtn').addEventListener('click', clearAll);
$('advToggle').addEventListener('click', ()=>{ $('adv').classList.toggle('show'); $('advToggle').classList.toggle('open'); });
$('quality').addEventListener('click', e=>{ const b=e.target.closest('.seg-btn'); if(!b||isRunning)return; $('quality').querySelectorAll('.seg-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); settings.crf=+b.dataset.crf; });
$('resolution').addEventListener('click', e=>{ const b=e.target.closest('.seg-btn'); if(!b||isRunning)return; $('resolution').querySelectorAll('.seg-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); settings.scale=+b.dataset.scale; });
function fmtSize(b){ if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function clearAll(){ items.forEach(it=>{ if(it.thumbUrl)URL.revokeObjectURL(it.thumbUrl); if(it.outUrl)URL.revokeObjectURL(it.outUrl); }); items=[]; errBox.classList.add('hidden'); resultCard.classList.add('hidden'); mainCard.classList.add('hidden'); drop.classList.remove('compact'); drop.querySelector('h2').textContent='動画をまとめてドラッグ&ドロップ'; render(); }
function addFiles(fileList){ const vids=[...fileList].filter(f=>f.type.startsWith('video/')); if(!vids.length){ if(fileList.length) showErr('動画ファイルが見つかりませんでした。'); return; } errBox.classList.add('hidden'); resultCard.classList.add('hidden'); vids.forEach(file=>{ const id=++uid; const it={ id, file, name:file.name, size:file.size, status:'wait', duration:0, width:0, height:0, thumbUrl:URL.createObjectURL(file) }; items.push(it); const v=document.createElement('video'); v.muted=true; v.preload='metadata'; v.src=it.thumbUrl; v.addEventListener('loadedmetadata', ()=>{ it.duration=v.duration; it.width=v.videoWidth; it.height=v.videoHeight; render(); }, { once:true }); }); mainCard.classList.remove('hidden'); drop.classList.add('compact'); drop.querySelector('h2').textContent='さらに追加'; render(); }
function removeItem(id){ if(isRunning)return; const i=items.findIndex(x=>x.id===id); if(i<0)return; const it=items[i]; if(it.thumbUrl)URL.revokeObjectURL(it.thumbUrl); if(it.outUrl)URL.revokeObjectURL(it.outUrl); items.splice(i,1); if(!items.length){ clearAll(); return; } render(); }
function render(){
  $('cntTotal').textContent=items.length; $('cntSize').textContent=fmtSize(items.reduce((s,x)=>s+x.size,0)); queueEl.innerHTML='';
  items.forEach(it=>{
    const div=document.createElement('div'); div.className='qitem '+(it.status==='done'?'done':it.status==='processing'?'processing':it.status==='error'?'error':'');
    let s='';
    if(it.status==='wait') s='<span class="qwait"></span> 待機中 · '+fmtSize(it.size);
    else if(it.status==='processing') s='<span class="qspin"></span> 小さくしています…';
    else if(it.status==='done'){ const r=Math.round((1-it.outSize/it.size)*100); s='<span>'+fmtSize(it.size)+'</span> <span class="arrow">→</span> <span class="ok">'+fmtSize(it.outSize)+' (-'+(r>0?r:0)+'%)</span>'; }
    else if(it.status==='error') s='<span class="err-t">エラー: '+(it.errMsg||'失敗')+'</span>';
    let a='';
    if(it.status==='done') a='<a class="qdl" href="'+it.outUrl+'" download="'+it.outName+'" title="ダウンロード"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></a>';
    else if(it.status==='wait' && !isRunning) a='<button class="qx" data-rm="'+it.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
    div.innerHTML='<video class="qthumb" src="'+it.thumbUrl+'#t=1" muted preload="metadata"></video><div class="qmeta"><div class="qname">'+it.name+'</div><div class="qstat">'+s+'</div><div class="qbar"><div class="qbar-fill" id="bar-'+it.id+'"></div></div></div><div class="qaction">'+a+'</div>';
    queueEl.appendChild(div);
  });
  queueEl.querySelectorAll('[data-rm]').forEach(b=> b.addEventListener('click', ()=> removeItem(+b.dataset.rm)));
  const waiting=items.filter(x=>x.status==='wait').length;
  goBtn.disabled = isRunning || waiting===0;
  goBtn.textContent = isRunning ? '処理中…' : (items.some(x=>x.status==='done') && waiting>0 ? '残り'+waiting+'件を小さくする' : 'すべて小さくする');
}
function showErr(msg){ errBox.textContent=msg; errBox.classList.remove('hidden'); }
async function loadFFmpeg(){
  if(ffmpegLoaded)return;
  // ① ライブラリ本体(ffmpeg.min.js)を複数CDNから順に試して読み込む
  if(typeof FFmpeg==='undefined' || !FFmpeg.createFFmpeg){
    const libUrls=[
      'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js',
      'https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js',
    ];
    let libOk=false;
    for(const url of libUrls){
      try { await loadScript(url); if(typeof FFmpeg!=='undefined' && FFmpeg.createFFmpeg){ libOk=true; break; } }
      catch(e){ console.warn('ライブラリCDN失敗:', url, e); }
    }
    if(!libOk) throw new Error('処理エンジン本体を読み込めませんでした（通信がブロックされている可能性）');
  }
  // ② コア(ffmpeg-core.js)も複数CDNを用意。先に到達できる方を使う
  const coreUrls=[
    'https://cdn.jsdelivr.net/npm/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
    'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js',
  ];
  let corePath=null;
  for(const url of coreUrls){
    try { const r=await fetch(url,{method:'HEAD',mode:'no-cors'}); corePath=url; break; }
    catch(e){ console.warn('コアCDN到達失敗:', url, e); }
  }
  if(!corePath) corePath=coreUrls[0]; // 念のため
  ffmpeg = FFmpeg.createFFmpeg({ log:false, corePath:corePath, mainName:'main', progress:({ratio})=>{ const cur=items.find(x=>x.status==='processing'); if(cur){ const pct=Math.min(99,Math.round((ratio||0)*100)); const bar=$('bar-'+cur.id); if(bar&&pct>0) bar.style.width=pct+'%'; } } });
  await ffmpeg.load();
  ffmpegLoaded=true;
}
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=resolve; s.onerror=()=>reject(new Error('load error: '+src));
    document.head.appendChild(s);
  });
}
goBtn.addEventListener('click', async ()=>{
  const todo=items.filter(x=>x.status==='wait'); if(!todo.length||isRunning)return;
  isRunning=true; errBox.classList.add('hidden'); resultCard.classList.add('hidden'); goBtn.disabled=true; render();
  if(!ffmpegLoaded){ $('engineLoad').classList.remove('hidden'); }
  try { await loadFFmpeg(); }
  catch(e){ console.error(e); $('engineLoad').classList.add('hidden'); showErr('処理エンジンの準備に失敗しました。\n\n原因：'+(e.message||e)+'\n\n考えられる対処：\n・社内ネットワークの場合、cdn.jsdelivr.net や unpkg.com への通信がブロックされている可能性があります。スマホのテザリングや自宅回線でお試しください\n・Chrome / Edge / Safari / Firefox の最新版で開いてください\n・ページを再読み込みしてもう一度お試しください'); isRunning=false; render(); return; }
  $('engineLoad').classList.add('hidden');
  for(const it of todo){
    it.status='processing'; render();
    try {
      const ext=(it.name.split('.').pop()||'mp4').toLowerCase();
      const inName='in_'+it.id+'.'+ext, outName='out_'+it.id+'.mp4';
      const buf=new Uint8Array(await it.file.arrayBuffer());
      ffmpeg.FS('writeFile', inName, buf);
      const args=['-i',inName];
      if(settings.scale>0 && it.height>settings.scale) args.push('-vf','scale=-2:'+settings.scale);
      args.push('-c:v','libx264','-crf',String(settings.crf),'-preset','veryfast','-c:a','aac','-b:a','96k','-movflags','+faststart',outName);
      await ffmpeg.run(...args);
      const data=ffmpeg.FS('readFile', outName);
      const blob=new Blob([data.buffer],{type:'video/mp4'});
      it.outBlob=blob; it.outSize=blob.size; it.outUrl=URL.createObjectURL(blob); it.outName=it.name.replace(/\.[^.]+$/,'')+'_small.mp4'; it.status='done';
      try{ ffmpeg.FS('unlink', inName); ffmpeg.FS('unlink', outName); }catch(e){}
    } catch(err){ console.error(err); it.status='error'; it.errMsg=String(err.message||err).slice(0,40); }
    render();
  }
  isRunning=false; render(); showSummary();
});
function showSummary(){ const done=items.filter(x=>x.status==='done'); if(!done.length)return; const before=done.reduce((s,x)=>s+x.size,0), after=done.reduce((s,x)=>s+x.outSize,0); const ratio=Math.round((1-after/before)*100); $('sumPct').textContent=(ratio>0?'-':'±')+(ratio>0?ratio:0)+'%'; $('sumLbl').textContent=done.length+'件完了 · 合計 '+fmtSize(before)+' → '+fmtSize(after)+'（'+fmtSize(before-after)+' 削減）'; $('dlAllLabel').textContent = done.length>1 ? done.length+'件すべてダウンロード' : 'ダウンロード'; resultCard.classList.remove('hidden'); }
$('dlAllBtn').addEventListener('click', async ()=>{ const done=items.filter(x=>x.status==='done'); for(const it of done){ const a=document.createElement('a'); a.href=it.outUrl; a.download=it.outName; document.body.appendChild(a); a.click(); a.remove(); await new Promise(r=>setTimeout(r,400)); } });
render();
</script>
</body>
